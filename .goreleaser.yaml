version: 2

project_name: music-syncer

before:
  hooks:
    - go mod tidy

builds:
  - id: music-syncer
    main: ./cmd/music-syncer
    binary: music-syncer
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/zxbass/music-syncer/internal/cli.Version={{ .Version }}
      - -X github.com/zxbass/music-syncer/internal/cli.Commit={{ .Commit }}
      - -X github.com/zxbass/music-syncer/internal/cli.Date={{ .Date }}

archives:
  - formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - README.md
      - LICENSE
      - config.example.yaml

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^chore:"

release:
  draft: false
  prerelease: auto
  name_template: "{{ .ProjectName }} {{ .Tag }}"
